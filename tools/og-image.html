<!DOCTYPE html>
<!--
  Vorlage für das Link-Vorschaubild (WhatsApp, Facebook, iMessage …), 1200 × 630 px.
  Nutzt dieselben Schriften, Farben, Formen und Fahrzeugbilder wie der Hero der Website.
  Neu erzeugen: siehe README → „Link-Vorschaubild“.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG-Bild Taxi Aktiv</title>
<style>
@font-face{font-family:'Poppins';font-style:normal;font-weight:500;src:url(../docs/assets/fonts/poppins-500.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:600;src:url(../docs/assets/fonts/poppins-600.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:700;src:url(../docs/assets/fonts/poppins-700.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-style:normal;font-weight:800;src:url(../docs/assets/fonts/poppins-800.woff2) format('woff2')}

@font-face{font-family:'DM Sans';font-style:normal;font-weight:400 700;src:url(../docs/assets/fonts/dmsans-var.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
.og{position:relative;width:1200px;height:630px;overflow:hidden;background:#fff;color:#151515;font-family:'DM Sans',sans-serif}
.abs{position:absolute}
</style>
</head>
<body>
<div class="og" id="og">
  <!-- Hintergrund: gleiche Welle wie im Desktop-Hero -->
  <svg class="abs" viewBox="0 0 1000 520" preserveAspectRatio="none" style="inset:0;width:100%;height:100%">
    <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE45A"/><stop offset="1" stop-color="#FFCC00"/></linearGradient></defs>
    <path d="M520 0H1000V478C820 512 640 455 450 492 300 520 150 488 0 515V360C140 420 320 380 410 270 480 180 450 70 520 0Z" fill="url(#hg)"/>
    <path d="M0 0H300C210 40 120 30 60 90 30 120 10 160 0 190Z" fill="#f6f6f4"/>
  </svg>
  <div class="abs" style="right:6%;top:60%;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.32)"></div>
  <div class="abs" style="right:31%;top:9%;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.45)"></div>
  <div class="abs" style="right:3.2%;top:19%;width:16px;height:16px;border-radius:50%;background:#151515;opacity:.85"></div>

  <!-- Logo (wie im Header, vergrößert) -->
  <div class="abs" style="left:56px;top:48px">
    <div style="display:flex;align-items:center;gap:11px">
      <svg width="80" height="30" viewBox="0 0 58 22"><path d="M2 20C14 6 34 2 56 3 38 6 22 12 12 20Z" fill="#151515"/><path d="M14 20C24 12 40 8 56 8 42 11 32 15 26 20Z" fill="#FFD000"/></svg>
      <span style="font:italic 800 42px/1 Poppins,sans-serif;letter-spacing:-.02em;white-space:nowrap">Taxi <span style="color:#FFC400">Aktiv</span></span>
    </div>
    <div style="font:700 12px/1 Poppins,sans-serif;letter-spacing:.6em;padding-left:92px;margin-top:2px">WILLINGEN</div>
  </div>

  <!-- Fahrzeug -->
  <div class="abs" style="left:46px;top:196px;width:590px;height:350px">
    <div class="abs" style="left:10%;right:10%;bottom:-2%;height:12%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent)"></div>
    <img src="../docs/assets/img/car-vwbus.webp" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.18))">
  </div>

  <!-- Text -->
  <div class="abs" style="left:700px;top:118px;width:450px;display:flex;flex-direction:column;gap:18px">
    <div style="font:600 15px Poppins,sans-serif;letter-spacing:.42em">TAXI AKTIV – WILLINGEN</div>
    <div style="font:800 58px/1.02 Poppins,sans-serif;letter-spacing:-.01em"><span style="font-weight:500">IMMER DA,<br>WENN SIE</span><br>EIN TAXI<br>BRAUCHEN</div>
    <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:14px;margin-top:10px;padding:10px 26px 10px 10px;border-radius:999px;background:#151515;color:#fff">
      <span style="width:48px;height:48px;border-radius:50%;background:#FFD000;display:grid;place-items:center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#151515" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      </span>
      <span style="display:flex;flex-direction:column;gap:3px">
        <span style="font:700 26px/1 Poppins,sans-serif;letter-spacing:.01em">05632 9988</span>
        <span style="font:500 14px/1 'DM Sans',sans-serif;color:#FFD000">24/7 erreichbar</span>
      </span>
    </div>
  </div>
</div>
</body>
</html>
